name: Publish

on:
  push:
    tags: ["v*"]

# Trusted publishing (OIDC): npm accepts this workflow's short-lived identity
# token, so there is no npm token anywhere. The trusted publisher is configured
# on npmjs.com for connie-app/connie-js, this file, publish.yml, and the
# environment npm.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Publishing waits for a reviewer's approval, and runs only for v* tags.
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in a release build.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.21.0
      - name: Tag matches package version
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi
      # Dependencies' install scripts never run. esbuild's postinstall, the only
      # one, just checks its binary; esbuild finds the binary through its
      # optional @esbuild/<platform> dependency without it.
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run size
      - run: npm run check:package
      # Provenance is generated automatically under trusted publishing.
      - run: npm publish --access public
