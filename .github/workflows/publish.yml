name: Publish

on:
  push:
    tags: ["v*"]

# Trusted publishing (OIDC): npm accepts this workflow's short-lived identity
# token, so there is no npm token anywhere. The trusted publisher is configured
# on npmjs.com for connie-app/connie-js and this file, publish.yml.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in a release build.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - name: Tag matches package version
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run size
      - run: npm run check:package
      # Provenance is generated automatically under trusted publishing.
      - run: npm publish --access public
